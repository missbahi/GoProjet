{% load static %}
<footer class="app-footer text-center py-4 text-sm">
    <div class="container mx-auto px-4">
        <div class="flex flex-col md:flex-row items-center justify-center gap-2">
            <div class="flex items-center space-x-2">
                <span>Solution développée par</span>
                <div class="flex items-center space-x-1">
                    <img src="{% static 'images/logo-goprojet.svg' %}"
                         alt="GoProjet"
                         class="h-6 w-auto"
                         onerror="handleDevLogoError(this)">
                    <span class="font-semibold" style="color: var(--text-inverse);">- Tous droits réservés.</span>
                </div>
            </div>
            <span class="hidden md:inline">•</span>
            <span style="color: var(--accent-green);">GoProjet</span>
            <span class="hidden md:inline">•</span>
            <span style="color: var(--text-muted); font-size: 0.75rem; opacity: 0.6;">v{{ APP_VERSION }}</span>
        </div>
    </div>
</footer>
