{% load static %}
<div id="mobileSidebar"
     class="sidebar-mobile fixed inset-y-0 left-0 z-50 w-64 md:hidden overflow-y-auto"
     style="background-color: var(--bg-surface); color: var(--text-primary); border-right: 1px solid var(--border-default);">

    <div class="p-4" style="border-bottom: 1px solid var(--border-default);">
        <div class="flex items-center justify-between">
            <a href="{% url 'projets:landing' %}" class="inline-block">
                <img src="{% static 'images/logo-goprojet.svg' %}" alt="Logo GoProjet" class="h-10 w-auto">
            </a>
            <button id="mobileSidebarClose" class="sidebar-close-btn p-1 rounded" type="button">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        <p class="text-sm mt-2 sidebar-logo-text">
            <i class="fas fa-database mr-1"></i> Gestion base de données
        </p>
    </div>

    <nav class="p-4">
        <div class="mb-6">
            <p class="text-xs uppercase font-semibold my-3 sidebar-section-title">Menu Principal</p>
            <ul class="space-y-2 text-lg">
                <li>
                    <button type="button" data-config-menu data-config-target="menu-ingenieurs-mobile"
                            data-config-url="{% url 'projets:partial_ingenieurs' %}"
                            class="sidebar-item w-full text-left">
                        <i class="fas fa-user-tie"></i><span>Ingénieurs / Chefs de projets</span>
                    </button>
                </li>
                <li>
                    <button type="button" data-config-menu data-config-target="menu-clients-mobile"
                            data-config-url="{% url 'projets:partial_clients' %}"
                            class="sidebar-item w-full text-left">
                        <i class="fas fa-users"></i><span>Clients / Maîtres d'ouvrages</span>
                    </button>
                </li>
                <li>
                    <button type="button" data-config-menu data-config-target="menu-entreprises-mobile"
                            data-config-url="{% url 'projets:partial_entreprises' %}"
                            class="sidebar-item w-full text-left">
                        <i class="fas fa-building"></i><span>Entreprises</span>
                    </button>
                </li>
                <li>
                    <button type="button" data-config-menu data-config-target="menu-types-materiel-mobile"
                            data-config-url="{% url 'projets:partial_types_materiel' %}"
                            class="sidebar-item w-full text-left">
                        <i class="fas fa-tractor"></i><span>Types de matériel</span>
                    </button>
                </li>
                <li>
                    <button type="button" data-config-menu data-config-target="menu-categories-mobile"
                            data-config-url="{% url 'projets:partial_categories_charges' %}"
                            class="sidebar-item w-full text-left">
                        <i class="fas fa-layer-group"></i><span>Catégories de charges</span>
                    </button>
                </li>
            </ul>
        </div>

        <div class="mb-6">
            <p class="text-xs uppercase font-semibold my-3 sidebar-section-title">Navigation</p>
            <ul class="space-y-2 text-lg">
                <li>
                    <a href="{% url 'home' %}" class="sidebar-item">
                        <i class="fas fa-house"></i><span>Retour au tableau de bord</span>
                    </a>
                </li>
            </ul>
        </div>
    </nav>
</div>
