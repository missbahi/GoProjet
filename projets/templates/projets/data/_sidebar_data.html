{% load static %}
<div class="sidebar w-72 flex-shrink-0 md:block hidden"
     style="background-color: var(--bg-surface); border-right: 1px solid var(--border-default);">

    <!-- En-tête -->
    <div class="p-4" style="border-bottom: 1px solid var(--border-default);">
        <a href="{% url 'projets:landing' %}" class="inline-block">
            <img src="{% static 'images/logo-goprojet.svg' %}"
                 alt="Logo GoProjet"
                 class="h-10 w-auto">
        </a>
        <p class="text-sm mt-2 sidebar-logo-text">
            <i class="fas fa-database mr-1"></i> Gestion base de données
        </p>
    </div>

    <!-- Navigation -->
    <nav class="p-4">

        <!-- Menu principal -->
        <div class="mb-6">
            <p class="text-xs uppercase font-semibold my-3 sidebar-section-title">Menu Principal</p>
            <ul class="space-y-2 text-lg">

                <li>
                    <button type="button"
                            data-config-menu
                            data-config-target="menu-ingenieurs"
                            data-config-url="{% url 'projets:partial_ingenieurs' %}"
                            class="sidebar-item w-full text-left">
                        <i class="fas fa-user-tie"></i>
                        <span>Chefs de projets</span>
                    </button>
                </li>

                <li>
                    <button type="button"
                            data-config-menu
                            data-config-target="menu-clients"
                            data-config-url="{% url 'projets:partial_clients' %}"
                            class="sidebar-item w-full text-left">
                        <i class="fas fa-users"></i>
                        <span>Maîtres d'ouvrages</span>
                    </button>
                </li>

                <li>
                    <button type="button"
                            data-config-menu
                            data-config-target="menu-entreprises"
                            data-config-url="{% url 'projets:partial_entreprises' %}"
                            class="sidebar-item w-full text-left">
                        <i class="fas fa-building"></i>
                        <span>Entreprises</span>
                    </button>
                </li>

                <li>
                    <button type="button"
                            data-config-menu
                            data-config-target="menu-types-materiel"
                            data-config-url="{% url 'projets:partial_types_materiel' %}"
                            class="sidebar-item w-full text-left">
                        <i class="fas fa-tractor"></i>
                        <span>Types de matériel</span>
                    </button>
                </li>

                <li>
                    <button type="button"
                            data-config-menu
                            data-config-target="menu-categories"
                            data-config-url="{% url 'projets:partial_categories_charges' %}"
                            class="sidebar-item w-full text-left">
                        <i class="fas fa-layer-group"></i>
                        <span>Catégories de charges</span>
                    </button>
                </li>

            </ul>
        </div>

        <!-- Retour app -->
        <div class="mb-6">
            <p class="text-xs uppercase font-semibold my-3 sidebar-section-title">Navigation</p>
            <ul class="space-y-2 text-lg">
                <li>
                    <a href="{% url 'home' %}" class="sidebar-item">
                        <i class="fas fa-house"></i>
                        <span>Retour au tableau de bord</span>
                    </a>
                </li>
            </ul>
        </div>

    </nav>
</div>
