{# projets/data/partials/ingenieurs.html #}

<h2 class="app-section-title mb-6">
    <i class="fa-solid fa-user-tie mr-3"></i>
    Liste des ingénieurs / chefs de projets
</h2>

{% if ingenieurs %}
<div class="app-card overflow-hidden">
    <table class="app-table">
        <thead>
            <tr>
                <th class="text-left">Nom</th>
                <th class="text-center">Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for ingenieur in ingenieurs %}
            <tr>
                <td>{{ ingenieur.nom }}</td>
                <td class="text-center space-x-3">
                    <button type="button"
                            data-edit
                            data-entity="ingenieur"
                            data-payload='{"id": {{ ingenieur.id }}, "nom": "{{ ingenieur.nom|escapejs }}"}'
                            class="app-action-btn app-action-edit"
                            title="Modifier">
                        <i class="fa-solid fa-pen"></i>
                    </button>
                    <button type="button"
                            data-delete
                            data-entity="ingenieur"
                            data-id="{{ ingenieur.id }}"
                            class="app-action-btn app-action-delete"
                            title="Supprimer">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}
<div class="app-empty-state">
    <i class="fa-solid fa-circle-info mr-2"></i>
    Aucun ingénieur enregistré.
</div>
{% endif %}

<div class="mt-6">
    <button type="button"
            data-add
            data-entity="ingenieur"
            class="app-btn-primary">
        <i class="fa-solid fa-plus mr-2"></i> Ajouter un ingénieur
    </button>
</div>
