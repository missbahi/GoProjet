{% load formatters %}

<div class="app-card p-4 md:p-6" id="lot-{{ lot.id }}">
    <div class="flex flex-col lg:flex-row lg:justify-between lg:items-start gap-3">
        <div class="flex-1">
            <h3 class="text-lg md:text-xl font-semibold mb-1" style="color: var(--accent-primary);">
                <i class="fas fa-cube mr-2"></i>{{ lot.nom }}
            </h3>
            <p class="font-medium text-sm md:text-base mb-2" style="color: var(--accent-green);">
                {{ lot.montant_formate }}
            </p>
            {% if lot.description %}
                <p class="text-sm mb-2" style="color: var(--text-secondary);">{{ lot.description }}</p>
            {% endif %}
        </div>
        <div class="flex flex-wrap gap-2">
            <a href="{% url 'projets:saisie_bordereau' projet.id lot.id %}"
               class="app-btn-primary"
               title="Ouvrir le bordereau">
                <i class="fas fa-edit"></i>
                <span class="hidden sm:inline ml-2">Bordereau</span>
            </a>
            <button type="button"
                    class="app-btn-secondary lot-edit-btn"
                    data-lot-id="{{ lot.id }}"
                    data-lot-nom="{{ lot.nom|escapejs }}"
                    data-lot-description="{{ lot.description|default:''|escapejs }}"
                    data-lot-taux-tva="{{ lot.taux_tva|raw_number }}"
                    title="Modifier le lot">
                <i class="fas fa-cog"></i>
                <span class="hidden sm:inline ml-2">Modifier</span>
            </button>
            <button type="button"
                    class="app-btn lot-delete-btn"
                    data-lot-id="{{ lot.id }}"
                    data-lot-nom="{{ lot.nom|escapejs }}"
                    data-lot-lignes="{{ lot.lignes.count }}"
                    style="background-color: var(--accent-danger); color: var(--text-inverse);"
                    title="Supprimer le lot">
                <i class="fas fa-trash"></i>
                <span class="hidden sm:inline ml-2">Supprimer</span>
            </button>
        </div>
    </div>
</div>
