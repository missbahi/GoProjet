<tr class="situation-stock-row border-b border-gray-700/70">
    {{ stock_form.id }}
    <td class="py-2 pr-2">{{ stock_form.designation }}</td>
    <td class="py-2 pr-2">{{ stock_form.unite }}</td>
    <td class="py-2 pr-2">{{ stock_form.quantite }}</td>
    <td class="py-2 pr-2">{{ stock_form.prix_unitaire }}</td>
    <td class="py-2 text-right"><button type="button" class="situation-delete-stock text-red-400 hover:text-red-300" title="Supprimer le stock" aria-label="Supprimer le stock"><i class="fas fa-trash"></i><span class="hidden">{{ stock_form.DELETE }}</span></button></td>
</tr>
