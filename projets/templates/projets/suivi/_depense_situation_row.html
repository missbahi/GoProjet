<tr class="situation-expense-row border-b border-gray-700/70">
    {{ depense_form.id }}
    {% if force_categorie %}<input type="hidden" name="{{ depense_form.categorie.html_name }}" id="{{ depense_form.categorie.id_for_label }}" value="{{ force_categorie }}">{% else %}{{ depense_form.categorie }}{% endif %}
    <td class="py-2 pr-2">{{ depense_form.designation }}</td>
    <td class="py-2 pr-2">{{ depense_form.montant }}</td>
    <td class="py-2 text-right"><button type="button" class="situation-delete-expense text-red-400 hover:text-red-300" title="Supprimer la dépense" aria-label="Supprimer la dépense"><i class="fas fa-trash"></i><span class="hidden">{{ depense_form.DELETE }}</span></button></td>
</tr>
