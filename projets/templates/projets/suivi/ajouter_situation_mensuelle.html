
{% extends 'projets/base.html' %}
{% block content %}
<div class="max-w-5xl mx-auto p-4">
    <div class="mb-5">
        <a href="{% url 'projets:situations_mensuelles' projet.id %}" class="inline-flex items-center text-sm text-gray-500 hover:text-gray-700 transition-colors duration-200 font-medium">
            <i class="fas fa-arrow-left mr-2"></i>
            Situations mensuelles
        </a>
        <div class="mt-4">
            <h1 class="text-2xl font-bold mt-2">
                Nouvelle situation mensuelle</h1>
            <p class="text-gray-500 mt-1 flex items-center text-sm">
                <i class="far fa-folder-open mr-2 text-amber-600"></i>
                {{ projet.nom }}
            </p>
        </div>
    </div>
    <div class="p-4 rounded border border-gray-700 bg-gray-800">
        {% include 'projets/suivi/_formulaire_situation_mensuelle.html' %}
    </div>
</div>
{% endblock %}
