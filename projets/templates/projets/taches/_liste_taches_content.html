{% load static %}
<div data-family="app">
    <div class="container mx-auto px-4 py-6">

        <!-- Titre -->
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-3xl font-bold" style="color: var(--accent-primary);">
                <i class="fas fa-tasks mr-2"></i>
                {% if projet %}
                    Tâches du projet : {{ projet.nom }}
                {% else %}
                    Toutes les tâches
                {% endif %}
            </h1>
        </div>

        <!-- Boutons -->
        {% if projets_disponibles %}
        <div class="flex justify-between items-center my-3">
            <button type="button"
                    onclick="openTaskModal(null, {% if projet %}{{ projet.id }}{% else %}null{% endif %})"
                    class="app-btn-primary text-white px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-plus"></i> Ajouter une tâche
            </button>
        </div>
        {% endif %}

        <!-- Filtres -->
        {% include "projets/taches/filtre_taches.html" %}

        <!-- Liste -->
        <div id="taches-container">
            {% include "projets/taches/_liste_taches_table.html" %}
        </div>
    </div>
</div>
