{# projets/templates/projets/taches/filtre_taches.html #}

<div class="app-card p-4 mb-4">
    <h3 class="font-medium mb-3" style="color: var(--text-primary);">
        <i class="fas fa-filter mr-2"></i>Filtrer les tâches
    </h3>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <!-- Responsable -->
        <div>
            <label class="app-modal-label">Responsable</label>
            <select id="filter-responsable" class="app-modal-input">
                <option value="">Tous les responsables</option>
                {% for user in responsables %}
                    <option value="{{ user.id }}">{{ user.username }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Statut -->
        <div>
            <label class="app-modal-label">Statut</label>
            <select id="filter-statut" class="app-modal-input">
                <option value="">Tous les statuts</option>
                <option value="false">En cours</option>
                <option value="true">Terminées</option>
            </select>
        </div>

        <!-- Priorité -->
        <div>
            <label class="app-modal-label">Priorité</label>
            <select id="filter-priorite" class="app-modal-input">
                <option value="">Toutes les priorités</option>
                <option value="URGENTE">Urgente</option>
                <option value="HAUTE">Haute</option>
                <option value="NORMALE">Normale</option>
                <option value="BASSE">Basse</option>
            </select>
        </div>

        <!-- Bouton Réinitialiser -->
        <div class="flex items-end">
            <button type="button"
                    onclick="resetFilters()"
                    class="app-btn-secondary w-full justify-center">
                <i class="fas fa-redo mr-2"></i>Réinitialiser
            </button>
        </div>
    </div>
</div>
