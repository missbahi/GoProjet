{% load static %}
<div id="passwordModal"
     class="fixed inset-0 z-50 flex items-center justify-center p-4"
     style="background-color: var(--modal-overlay); backdrop-filter: blur(4px);">

    <div class="rounded-2xl shadow-2xl w-full max-w-md"
         style="background-color: var(--modal-bg); color: var(--text-primary); border: 1px solid var(--border-default);">

        <!-- En-tête -->
        <div class="flex justify-between items-center p-6"
             style="border-bottom: 1px solid var(--border-default);">
            <h3 class="text-xl font-bold" style="color: var(--accent-warning);">
                <i class="fas fa-key mr-2"></i>Changer le mot de passe
            </h3>
            <button type="button"
                    onclick="closeModal('passwordModal')"
                    class="modal-close-btn rounded-full p-2 transition duration-200">
                <i class="fas fa-times text-lg"></i>
            </button>
        </div>

        <!-- Formulaire -->
        <form method="post" action="{% url 'projets:password_change' %}" class="p-6 space-y-6">
            {% csrf_token %}

            <div class="space-y-4">
                <!-- Ancien mot de passe -->
                <div>
                    <label class="block text-sm font-medium mb-2" style="color: var(--text-primary);">
                        <i class="fas fa-lock mr-2" style="color: var(--accent-danger);"></i>Ancien mot de passe
                    </label>
                    <input type="password"
                           name="old_password"
                           required
                           class="app-input"
                           placeholder="Votre mot de passe actuel">
                </div>

                <!-- Nouveau mot de passe -->
                <div>
                    <label class="block text-sm font-medium mb-2" style="color: var(--text-primary);">
                        <i class="fas fa-lock-open mr-2" style="color: var(--accent-green);"></i>Nouveau mot de passe
                    </label>
                    <input type="password"
                           name="new_password1"
                           required
                           class="app-input"
                           placeholder="Votre nouveau mot de passe">
                </div>

                <!-- Confirmation -->
                <div>
                    <label class="block text-sm font-medium mb-2" style="color: var(--text-primary);">
                        <i class="fas fa-shield-alt mr-2" style="color: var(--accent-info);"></i>Confirmer le mot de passe
                    </label>
                    <input type="password"
                           name="new_password2"
                           required
                           class="app-input"
                           placeholder="Confirmez votre nouveau mot de passe">
                </div>
            </div>

            <!-- Info -->
            <div class="rounded-lg p-3"
                 style="background-color: var(--bg-elevated); border: 1px solid var(--border-default);">
                <p class="text-xs flex items-center" style="color: var(--text-secondary);">
                    <i class="fas fa-info-circle mr-2" style="color: var(--accent-info);"></i>
                    Votre mot de passe doit contenir au moins 8 caractères.
                </p>
            </div>

            <!-- Boutons -->
            <div class="flex space-x-3 pt-4">
                <button type="button"
                        onclick="closeModal('passwordModal')"
                        class="app-btn-secondary flex-1 px-4 py-3 rounded-lg font-semibold">
                    <i class="fas fa-times mr-2"></i>Annuler
                </button>
                <button type="submit"
                        class="flex-1 text-white px-4 py-3 rounded-lg font-semibold shadow-lg transition duration-200"
                        style="background-color: var(--accent-warning);">
                    <i class="fas fa-check mr-2"></i>Valider
                </button>
            </div>
        </form>
    </div>
</div>
