{% load static %}
<div id="profileModal"
     class="fixed inset-0 z-50 flex items-center justify-center p-4"
     style="background-color: var(--modal-overlay); backdrop-filter: blur(4px);">

    <div class="rounded-2xl shadow-2xl w-full max-w-md"
         style="background-color: var(--modal-bg); color: var(--text-primary); border: 1px solid var(--border-default);">

        <!-- En-tête -->
        <div class="flex justify-between items-center p-6"
             style="border-bottom: 1px solid var(--border-default);">
            <h3 class="text-xl font-bold" style="color: var(--accent-green);">
                <i class="fas fa-user-circle mr-2"></i>Mon Profil
            </h3>
            <button type="button"
                    onclick="closeModal('profileModal')"
                    class="modal-close-btn rounded-full p-2 transition duration-200">
                <i class="fas fa-times text-lg"></i>
            </button>
        </div>

        <!-- Contenu -->
        <div class="p-6">
            <form id="profileForm" method="post"
                  action="{% url 'projets:profile_update' %}"
                  enctype="multipart/form-data"
                  class="space-y-6">

                {% csrf_token %}

                <!-- Avatar -->
                <div class="text-center">
                    <label class="block text-sm font-medium mb-3" style="color: var(--text-primary);">
                        Photo de profil
                    </label>
                    <div class="flex flex-col items-center space-y-4">
                        <div class="relative">
                            <img id="avatarPreview"
                                 src="{{ user.profile.avatar_url }}"
                                 class="w-24 h-24 rounded-full object-cover shadow-lg"
                                 style="border: 4px solid var(--accent-green);"
                                 onerror="this.src='{% static 'images/default.png' %}'">
                            <div class="absolute -bottom-2 -right-2 rounded-full p-1 shadow-lg"
                                 style="background-color: var(--accent-green);">
                                <i class="fas fa-camera text-white text-xs"></i>
                            </div>
                        </div>

                        <!-- Bouton changer la photo -->
                        <button type="button"
                                hx-get="{% url 'projets:avatar_upload_modal' %}"
                                hx-target="#modals-nested-container"
                                hx-swap="innerHTML"
                                class="app-btn-primary text-white px-4 py-2 rounded-lg font-semibold">
                            <i class="fas fa-camera mr-2"></i>Changer la photo
                        </button>
                    </div>
                </div>

                <!-- Informations utilisateur -->
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium mb-2" style="color: var(--text-primary);">
                                <i class="fas fa-user mr-2" style="color: var(--accent-info);"></i>Prénom
                            </label>
                            <input type="text" name="first_name" value="{{ user.first_name }}"
                                   class="app-input"
                                   placeholder="Prénom">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-2" style="color: var(--text-primary);">
                                <i class="fas fa-user mr-2" style="color: var(--accent-info);"></i>Nom
                            </label>
                            <input type="text" name="last_name" value="{{ user.last_name }}"
                                   class="app-input"
                                   placeholder="Nom">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-2" style="color: var(--text-primary);">
                            <i class="fas fa-envelope mr-2" style="color: var(--accent-warning);"></i>Adresse email
                        </label>
                        <input type="email"
                               name="email"
                               value="{{ user.email }}"
                               class="app-input"
                               placeholder="votre@email.com">
                    </div>
                </div>

                <!-- Boutons -->
                <div class="flex space-x-3 pt-4">
                    <button type="button"
                            onclick="closeModal('profileModal')"
                            class="app-btn-secondary flex-1 px-4 py-3 rounded-lg font-semibold">
                        <i class="fas fa-times mr-2"></i>Annuler
                    </button>
                    <button type="submit"
                            id="submitProfileBtn"
                            class="app-btn-primary text-white flex-1 px-4 py-3 rounded-lg font-semibold shadow-lg">
                        <i class="fas fa-save mr-2"></i>Enregistrer
                    </button>
                </div>
            </form>

            <!-- Changer mot de passe -->
            <div class="mt-6 pt-6 text-center" style="border-top: 1px solid var(--border-default);">
                <button type="button"
                        hx-get="{% url 'projets:password_modal' %}"
                        hx-target="#modals-container"
                        hx-swap="innerHTML"
                        class="font-medium transition duration-200 group"
                        style="color: var(--accent-green);">
                    <i class="fas fa-key mr-2 group-hover:animate-bounce"></i>
                    Changer le mot de passe
                </button>
            </div>
        </div>
    </div>
</div>
