{% load static %}
<div id="avatar-upload-modal"
     class="fixed inset-0 z-50 flex items-center justify-center p-4"
     style="background-color: var(--modal-overlay); backdrop-filter: blur(4px);">

    <div class="rounded-2xl shadow-2xl w-full max-w-md"
         style="background-color: var(--modal-bg); color: var(--text-primary); border: 1px solid var(--border-default);">

        <!-- En-tête -->
        <div class="flex justify-between items-center p-6"
             style="border-bottom: 1px solid var(--border-default);">
            <h3 class="text-xl font-bold" style="color: var(--accent-green);">
                <i class="fas fa-camera mr-2"></i>Changer la photo de profil
            </h3>
            <button type="button"
                    onclick="closeAvatarModal()"
                    class="modal-close-btn rounded-full p-2 transition-colors duration-200">
                <i class="fas fa-times text-lg"></i>
            </button>
        </div>

        <!-- Formulaire -->
        <form method="post"
              action="{% url 'projets:upload_avatar' %}"
              enctype="multipart/form-data"
              class="p-6"
              hx-post="{% url 'projets:upload_avatar' %}"
              hx-encoding="multipart/form-data">
            {% csrf_token %}

            <div class="text-center mb-6">
                <img src="{{ user.profile.avatar_url }}"
                     class="w-32 h-32 rounded-full mx-auto mb-4"
                     style="border: 4px solid var(--accent-green);"
                     id="avatar-preview"
                     alt="Avatar"
                     onerror="this.src='{% static 'images/default.png' %}'">

                <input type="file"
                       name="avatar"
                       id="avatar-input"
                       accept="image/*"
                       class="hidden"
                       onchange="previewAvatar(this)">

                <label for="avatar-input"
                       class="block w-full text-white text-center py-3 rounded-lg cursor-pointer transition duration-200 font-semibold mb-2"
                       style="background-color: var(--accent-green);">
                    <i class="fas fa-folder-open mr-2"></i>Sélectionner une image
                </label>

                <p class="text-xs" style="color: var(--text-muted);">
                    <i class="fas fa-info-circle mr-1"></i>
                    Formats: JPG, PNG, GIF • Maximum 5MB
                </p>
            </div>

            <div class="flex space-x-3">
                <button type="button"
                        onclick="closeAvatarModal()"
                        class="app-btn-secondary flex-1 px-4 py-3 rounded-lg font-semibold transition duration-200">
                    Annuler
                </button>
                <button type="submit"
                        id="submitAvatarBtn"
                        class="app-btn-primary text-white flex-1 px-4 py-3 rounded-lg font-semibold transition duration-200 hidden">
                    Enregistrer
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function previewAvatar(input) {
    const MAX_FILE_SIZE = 5 * 1024 * 1024;
    const submitBtn = document.getElementById('submitAvatarBtn');

    if (input.files && input.files[0]) {
        const file = input.files[0];

        if (file.size > MAX_FILE_SIZE) {
            alert(`L'image est trop volumineuse (${(file.size / 1024 / 1024).toFixed(2)} Mo). La limite est de 5 Mo.`);
            input.value = "";
            submitBtn.classList.add('hidden');
            return;
        }

        const reader = new FileReader();
        const preview = document.getElementById('avatar-preview');

        reader.onload = function(e) {
            preview.src = e.target.result;
            submitBtn.classList.remove('hidden');
            preview.classList.add('ring-2', 'ring-green-400');
            setTimeout(() => {
                preview.classList.remove('ring-2', 'ring-green-400');
            }, 1000);
        };
        reader.readAsDataURL(file);
    } else {
        submitBtn.classList.add('hidden');
    }
}

function closeAvatarModal() {
    const modal = document.getElementById('avatar-upload-modal');
    if (modal) {
        modal.remove();
    }
}
</script>
