<dialog id="xml-export-dialog" aria-labelledby="xml-export-title">
    <form method="dialog">
        <div class="flex items-center justify-between gap-4 mb-4">
            <h2 id="xml-export-title" class="text-xl font-semibold" style="color: var(--accent-primary);">
                <i class="fas fa-file-export mr-2" aria-hidden="true"></i>Exporter le planning
            </h2>
            <button type="button" data-xml-export-cancel class="app-btn-secondary" aria-label="Fermer l’exportation XML">
                <i class="fas fa-times" aria-hidden="true"></i>
            </button>
        </div>
        <p data-xml-export-name class="font-semibold mb-2"></p>
        <p class="text-sm mb-2">MS Project XML — MSPDI</p>
        <p data-xml-export-filename class="text-sm mb-4"></p>
        <p class="text-sm mb-4" style="color: var(--text-secondary);">
            Seules les données enregistrées sont exportées.
        </p>
        <p data-xml-export-status role="status" aria-live="polite"></p>
        <p data-xml-export-error role="alert" hidden></p>
        <div class="flex justify-end gap-3 mt-4">
            <button type="button" data-xml-export-cancel class="app-btn-secondary">Annuler</button>
            <button type="submit" class="app-btn-primary" data-xml-export-download>
                <i class="fas fa-download mr-1" aria-hidden="true"></i>
                <span data-xml-export-label>Télécharger XML</span>
            </button>
        </div>
    </form>
</dialog>
