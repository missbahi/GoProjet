<dialog id="xml-import-dialog" aria-label="Importation XML">
    <div class="flex justify-end">
        <button type="button" data-xml-import-cancel class="app-btn-secondary" aria-label="Fermer l’importation XML">
            <i class="fas fa-times" aria-hidden="true"></i>
        </button>
    </div>
    <p data-xml-import-status role="status" aria-live="polite"></p>
    <p data-xml-import-error role="alert" hidden></p>
    <div data-xml-import-content></div>
</dialog>
